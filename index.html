<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HC-05 Wireless Switch</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    h2 {
      font-size: 1.25rem;
      color: #38bdf8;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      padding: 10px;
      background: #090d16;
      border-radius: 6px;
    }
    .indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      transition: background 0.3s;
    }
    .indicator.connected {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }
    button {
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
    }
    button:not(:disabled):hover {
      filter: brightness(1.1);
    }
    button:not(:disabled):active {
      transform: scale(0.98);
    }
    .btn-connect {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      margin-bottom: 14px;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .btn-on { background: #16a34a; color: #fff; }
    .btn-off { background: #dc2626; color: #fff; }
    .btn-disconnect {
      width: 100%;
      background: #475569;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="panel">
    <h2>HC-05 Controller</h2>
    <p class="subtitle">Wireless Switch for Pin 11</p>

    <div class="status-bar">
      <div id="dot" class="indicator"></div>
      <span id="statusTxt">Disconnected</span>
    </div>

    <button id="btnConnect" class="btn-connect">Connect Bluetooth</button>

    <div class="btn-grid">
      <button id="btnOn" class="btn-on" disabled>LED ON</button>
      <button id="btnOff" class="btn-off" disabled>LED OFF</button>
    </div>

    <button id="btnDisconnect" class="btn-disconnect" disabled>Disconnect</button>
  </div>

  <script>
    let port;
    let writer;

    const btnConnect = document.getElementById('btnConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const btnOn = document.getElementById('btnOn');
    const btnOff = document.getElementById('btnOff');
    const statusTxt = document.getElementById('statusTxt');
    const dot = document.getElementById('dot');

    if (!('serial' in navigator)) {
      statusTxt.textContent = 'Web Serial unsupported (Use Chrome/Edge)';
      btnConnect.disabled = true;
    }

    btnConnect.addEventListener('click', async () => {
      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });

        writer = port.writable.getWriter();

        dot.classList.add('connected');
        statusTxt.textContent = 'Connected';
        btnConnect.disabled = true;
        btnDisconnect.disabled = false;
        btnOn.disabled = false;
        btnOff.disabled = false;
      } catch (err) {
        statusTxt.textContent = 'Connection Failed';
      }
    });

    async function sendCommand(char) {
      if (writer) {
        try {
          const encoder = new TextEncoder();
          await writer.write(encoder.encode(char));
        } catch (err) {
          statusTxt.textContent = 'Write error';
        }
      }
    }

    btnOn.addEventListener('click', () => sendCommand('1'));
    btnOff.addEventListener('click', () => sendCommand('0'));

    btnDisconnect.addEventListener('click', async () => {
      try {
        if (writer) {
          await writer.releaseLock();
          writer = null;
        }
        if (port) {
          await port.close();
          port = null;
        }

        dot.classList.remove('connected');
        statusTxt.textContent = 'Disconnected';
        btnConnect.disabled = false;
        btnDisconnect.disabled = true;
        btnOn.disabled = true;
        btnOff.disabled = true;
      } catch (err) {
        statusTxt.textContent = 'Disconnect error';
      }
    });
  </script>
</body>
</html>
